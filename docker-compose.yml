version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: rocket
    restart: always
    environment:
      POSTGRES_USER: rocket
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rocket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres_network

volumes:
  postgres_data:

networks:
  postgres_network:
